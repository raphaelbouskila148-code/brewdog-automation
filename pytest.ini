[pytest]
testpaths = tests
addopts = --headed --slowmo 300 -s --tb=short --alluredir=allure-results --clean-alluredir --html=reports/report.html --self-contained-html --screenshot only-on-failure --video retain-on-failure --tracing retain-on-failure
markers =
    smoke: fast checks that the main pages load and work
    regression: deeper checks of key user flows
    mobile: checks on a phone sized screen
